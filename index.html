<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness</title>
<link rel="icon" href="food/icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1c1a;--muted:#6b6a64;--line:#e3e1d9;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#21211e;--ink:#f0efec;--muted:#a3a29b;--line:#36352f;--accent:#4b93ea}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 16px}
.app{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;color:var(--ink);text-decoration:none}
a.app:active{background:var(--line)}
.app b{display:block;font-size:18px}
.app span{color:var(--muted);font-size:14px}
.app.later{opacity:.6}
</style></head><body><main>
<h1>Fitness</h1>
<a class="app" href="food/"><b>Food log</b><span>Calories and protein, works offline. Install it from Chrome’s menu for a home-screen icon.</span></a>
<div class="app later"><b>Workout tracker</b><span>Still runs from the laptop launcher for now.</span></div>
</main></body></html>
